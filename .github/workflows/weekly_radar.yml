name: Weekly Frontier Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
      timezone: "Asia/Shanghai"

# The workflow does not need pull-request, issue, package, or id-token access.
permissions:
  contents: write

concurrency:
  group: radar-persistence
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run offline regression tests
        run: pytest

      - name: Generate and deliver weekly Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: >-
          github-frontier-radar weekly
          --report-base-url
          "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/reports"

      - name: Persist weekly report and feature history
        run: |
          git add data/state.json reports
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(radar): publish weekly report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
